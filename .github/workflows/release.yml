name: Build and sign Gefahrstoffkataster release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: &release_paths
      - 'appinfo/info.xml'
      - 'docs/releases/**'
      - '.github/workflows/release.yml'
      - '.github/scripts/gefahrstoffkataster-occ.sh'
  pull_request:
    paths: *release_paths

permissions:
  contents: read

concurrency:
  group: gefahrstoffkataster-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.metadata.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: simplexml,xmlreader,mbstring
          tools: composer:v2
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Read release metadata from this commit
        working-directory: .
        id: metadata
        run: |
          set -euo pipefail
          version=$(php -r 'echo simplexml_load_file("appinfo/info.xml")->version;')
          test "$(php -r 'echo simplexml_load_file("appinfo/info.xml")->id;')" = "gefahrstoffkataster"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test -s "docs/releases/$version.md"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build and check release files
        working-directory: .
        env:
          VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          set -euo pipefail
          node tests/inventory-navigation.js
          node tests/sds-ui.js
          test -s js/app.js
          test -s css/style.css
          find lib templates appinfo -name '*.php' -type f -print0 | xargs -0 -n1 php -l >/dev/null
          stage="$RUNNER_TEMP/stage/gefahrstoffkataster"
          mkdir -p "$stage" "$RUNNER_TEMP/unsigned"
          cp -a appinfo lib templates img js css "$stage/"
          for item in l10n LICENSE COPYING README.md CHANGELOG.md; do
            if [[ -e "$item" ]]; then cp -a "$item" "$stage/"; fi
          done
          rm -f "$stage/appinfo/signature.json"
          tar -czf "$RUNNER_TEMP/unsigned/package.tar.gz" -C "$RUNNER_TEMP/stage" gefahrstoffkataster
          cp "docs/releases/$VERSION.md" "$RUNNER_TEMP/unsigned/release.md"

      - name: Check isolated Nextcloud signing tools
        if: github.event_name == 'pull_request'
        run: bash .github/scripts/gefahrstoffkataster-occ.sh "$RUNNER_TEMP/stage" check-tools

      - uses: actions/upload-artifact@v4
        with:
          name: unsigned-gefahrstoffkataster-${{ github.run_id }}
          path: ${{ runner.temp }}/unsigned/
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  release:
    needs: build
    if: github.repository == 'Happyfeet01/gefStoffReg-NC' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.build.outputs.version }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check published release and tag
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="v$VERSION"
          if gh release view "$tag" --json isDraft,assets > "$RUNNER_TEMP/existing.json"; then
            if jq -e '.isDraft == false' "$RUNNER_TEMP/existing.json" >/dev/null; then
              for suffix in tar.gz signature tar.gz.sha256; do
                jq -e --arg name "gefahrstoffkataster-$VERSION.$suffix" 'any(.assets[]; .name == $name)' "$RUNNER_TEMP/existing.json" >/dev/null
              done
              echo 'published=true' >> "$GITHUB_OUTPUT"
            fi
          fi
          if git ls-remote --exit-code "https://github.com/$GH_REPO.git" "refs/tags/$tag" >/dev/null; then
            tagged=$(gh api "repos/$GH_REPO/commits/$tag" --jq .sha)
            test "$tagged" = "$GITHUB_SHA" || { echo "::error::Tag $tag belongs to another commit"; exit 1; }
          fi

      - uses: actions/download-artifact@v4
        if: steps.existing.outputs.published != 'true'
        with:
          name: unsigned-gefahrstoffkataster-${{ github.run_id }}
          path: ${{ runner.temp }}/unsigned

      - name: Sign and verify application and final archive
        if: steps.existing.outputs.published != 'true'
        env:
          APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
          APP_PUBLIC_CRT: ${{ secrets.APP_PUBLIC_CRT }}
        run: |
          set -euo pipefail
          umask 077
          : "${APP_PRIVATE_KEY:?Set the APP_PRIVATE_KEY Actions secret}"
          : "${APP_PUBLIC_CRT:?Set the APP_PUBLIC_CRT Actions secret}"
          keys=$(mktemp -d)
          trap 'rm -rf -- "$keys"' EXIT
          printf '%s\n' "$APP_PRIVATE_KEY" > "$keys/gefahrstoffkataster.key"
          printf '%s\n' "$APP_PUBLIC_CRT" > "$keys/gefahrstoffkataster.crt"
          unset APP_PRIVATE_KEY APP_PUBLIC_CRT
          umask 022
          stage="$RUNNER_TEMP/stage"
          out="$RUNNER_TEMP/signed"
          mkdir -p "$stage" "$out"
          tar -xzf "$RUNNER_TEMP/unsigned/package.tar.gz" -C "$stage"
          bash .github/scripts/gefahrstoffkataster-occ.sh "$stage" sign "$keys"
          cd "$out"
          archive="gefahrstoffkataster-$VERSION.tar.gz"
          tar -czf "$archive" -C "$stage" gefahrstoffkataster
          openssl dgst -sha512 -sign "$keys/gefahrstoffkataster.key" -out "$RUNNER_TEMP/archive.sig" "$archive"
          openssl base64 -A -in "$RUNNER_TEMP/archive.sig" -out "gefahrstoffkataster-$VERSION.signature"
          openssl base64 -d -A -in "gefahrstoffkataster-$VERSION.signature" -out "$RUNNER_TEMP/verify.sig"
          openssl x509 -in "$keys/gefahrstoffkataster.crt" -pubkey -noout > "$RUNNER_TEMP/pubkey.pem"
          openssl dgst -sha512 -verify "$RUNNER_TEMP/pubkey.pem" -signature "$RUNNER_TEMP/verify.sig" "$archive"
          sha256sum "$archive" > "$archive.sha256"

      - name: Publish verified files together
        if: steps.existing.outputs.published != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="v$VERSION"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --draft --target "$GITHUB_SHA" --title "Gefahrstoffkataster $VERSION" \
              --notes-file "$RUNNER_TEMP/unsigned/release.md"
          fi
          gh release view "$tag" --json isDraft,targetCommitish | jq -e --arg sha "$GITHUB_SHA" \
            '.isDraft and .targetCommitish == $sha' >/dev/null
          cd "$RUNNER_TEMP/signed"
          gh release upload "$tag" "gefahrstoffkataster-$VERSION.tar.gz" "gefahrstoffkataster-$VERSION.signature" \
            "gefahrstoffkataster-$VERSION.tar.gz.sha256" --clobber
          gh release edit "$tag" --draft=false --latest
